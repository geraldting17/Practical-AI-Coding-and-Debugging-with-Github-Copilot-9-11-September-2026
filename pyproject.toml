[project]
name = "ticketing-system"
version = "0.1.0"
description = "A small ticketing system built with FastAPI, DuckDB, NiceGUI, and MCP."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb==1.3.2",
    "fastapi==0.116.1",
    "mcp==1.13.1",
    "nicegui==2.19.0",
    "pydantic==2.11.7",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "sphinx>=9.0.4",
]
